name: Tests

on:
  push:
    branches: ["main", "v*"]
  pull_request:
    branches: ["main"]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          pip install --quiet \
            pytest pytest-asyncio \
            pandas numpy scipy \
            colorama

      - name: Run tests
        run: pytest tests/ -v --timeout=60 -x
        # -x  stops on first failure so the error is immediately visible
        # Heavy dependencies (AutoGluon, alpaca) are mocked in existing tests
