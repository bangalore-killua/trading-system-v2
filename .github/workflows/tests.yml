name: Tests

on:
  push:
    branches: ["main", "v*"]
  pull_request:
    branches: ["main"]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          pip install --quiet \
            pytest pytest-asyncio pytest-timeout \
            pandas numpy scipy \
            colorama pytz \
            mplfinance Pillow

      - name: Run tests
        run: pytest tests/ -v --timeout=60
        # Heavy dependencies (AutoGluon, alpaca) are mocked in existing tests
        # Pre-existing broken tests are marked xfail in conftest.py
